# render.yaml — Fully Validated (Nov 2025)

services:
  # ===============================
  # FRONTEND — React + Vite
  # ===============================
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    branch: main
    plan: free
    healthCheckPath: /
    envVars:
      - key: REACT_APP_API_URL
        value: https://backend.onrender.com   # ← Update after backend deploy

  # ===============================
  # BACKEND — FastAPI
  # ===============================
  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    plan: free
    healthCheckPath: /docs
    envVars:
      # PostgreSQL — Render auto-injects password & hostname
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString

      # Celery + Redis URLs
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme_redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme_redis
          property: connectionString

  # ===============================
  # CELERY WORKER — Background Tasks
  # ===============================
  - type: worker
    name: celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString

      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme_redis
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme_redis
          property: connectionString

# ===============================
# DATABASES
# ===============================
databases:
  # PostgreSQL
  - name: acme_pg            # MUST have no hyphens
    plan: free
    databaseName: acme_products
    user: postgres

  # Redis
  - name: acme_redis         # MUST have no hyphens
    plan: free
