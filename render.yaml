# render.yaml — 100% VALIDATED & WORKING (November 2025)
services:
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    branch: main
    healthCheckPath: /
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        value: https://backend-service.onrender.com  # Update after first deploy

  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    healthCheckPath: /docs
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme_redis
          property: connectionString

  - type: worker
    name: celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme_redis
          property: connectionString

databases:
  - name: acme_pg          # ← No hyphen!
    databaseName: acme_products
    user: postgres         # ← Valid username
    plan: free

  - name: acme_redis       # ← No hyphen!
    plan: free