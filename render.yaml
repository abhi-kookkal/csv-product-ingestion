services:
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion
    branch: main
    envVars:
      - key: REACT_APP_API_URL
        value: https://backend.onrender.com  # Your backend URL (set after deploy)

  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: acme_redis
          property: connectionString
    plan: free  # Free tier

  - type: worker  # For Celery
    name: celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme_pg
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: acme_redis
          property: connectionString
    plan: free
    buildCommand: echo "No build needed"
    runCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

databases:
  - name: acme_pg
    databaseName: acme_products
    user: postgres
    plan: free  # 90 days, 1GB

  - name: acme_redis
    plan: free  # Ephemeral, 25MB