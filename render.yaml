# render.yaml — WORKING VERSION (November 2025)
services:
  # ==================== FRONTEND ====================
  - type: web
    name: frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion.git
    branch: main
    healthCheckPath: /
    autoDeploy: true
    plan: free
    envVars:
      - key: REACT_APP_API_URL
        value: https://backend-service.onrender.com  # ← Update after deploy

  # ==================== BACKEND API ====================
  - type: web
    name: backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion.git
    branch: main
    healthCheckPath: /docs
    autoDeploy: true
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme-redis
          property: connectionString

  # ==================== CELERY WORKER ====================
  - type: worker          # ← This is the only place runCommand is allowed!
    name: celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/abhi-kookkal/csv-product-ingestion.git
    branch: main
    autoDeploy: true
    plan: free
    # ← Correct field name for workers
    startCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acme-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromDatabase:
          name: acme-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromDatabase:
          name: acme-redis
          property: connectionString

# ==================== DATABASES ====================
databases:
  - name: acme-postgres
    databaseName: acme_products
    user: postgres
    plan: free    # 90 days, 1GB

  - name: acme-redis
    plan: free    # Ephemeral, 25MB